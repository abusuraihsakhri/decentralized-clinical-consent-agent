services:
  decentralized-clinical-consent-engine:
    build: .
    container_name: decentralized-clinical-consent-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY before deployment}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?Set an API_AUTH_TOKEN before deployment}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
