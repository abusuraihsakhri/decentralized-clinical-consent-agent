name: Python tests and browser syntax

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q agents consent_ledger cli.py simulator.py enrichment.py
      - name: Run regression suite
        run: python -m pytest -q
      - name: Audit installed Python dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict --skip-editable --progress-spinner off
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert len(matches) == 1, "Expected one inline script"
          Path("/tmp/consent-browser.js").write_text(matches[0], encoding="utf-8")
          PY
          node --check /tmp/consent-browser.js
          node tests/check_browser.cjs
