name: Publish browser rules preview

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error "$PAGES_URL" --output /tmp/consent-page.html &&
               grep -q "LOCAL_RULES_PREVIEW" /tmp/consent-page.html &&
               grep -q "Decentralized Clinical Consent Agent" /tmp/consent-page.html; then
              echo "Published browser preview loaded successfully"
              exit 0
            fi
            sleep 5
          done
          echo "Published site was not reachable with expected application content" >&2
          exit 1
